packages:
  - apps/*
  # Each package sits in the folder of its layer (ADR 0002).
  - packages/*/*

# Build scripts allowed to run: esbuild and unrs-resolver compile native
# helpers, electron-winstaller is part of packaging.
allowBuilds:
  electron-winstaller: true
  esbuild: true
  # koffi ships prebuilt binaries for the platforms this app targets, so its
  # build script has nothing to do. It does not run here; listing it records
  # that choice, so pnpm does not ask.
  koffi: false
  unrs-resolver: true

# Advisories with no fix that do not apply here, each with why.
auditConfig:
  ignoreGhsas:
    # http-cache-semantics <=4.2.0, with no fixed version: a cache shared by
    # several users can hand one user's blanked-out response to another who
    # asks with a large max-stale. It reaches us only as
    # electron-builder > app-builder-lib > @electron/get 3 > got >
    # cacheable-request, the build-time download of Electron on one machine
    # for one user, and got consults it only when given a cache. Nothing of it
    # ships.
    - GHSA-ch52-4w7c-c8xp
    # sprintf-js <=1.1.3, with no fixed version: a format string with an
    # unbounded precision specifier can stall the process. It reaches
    # us only as electron-builder > app-builder-lib > @electron/get 3 >
    # global-agent > roarr, the logger of the same build-time download of
    # Electron, which formats its own fixed messages. Nothing of it ships.
    # @electron/get 5 drops global-agent; app-builder-lib 26.15.3 still asks
    # for 3.
    - GHSA-hp3w-g68c-fv3c
    # minimatch <11.0.1: a glob pattern someone else supplies can make the
    # preprocessing at optimizationLevel 2 grow, then compare its parts
    # pairwise. Each copy that can take the fix is moved to it under
    # `overrides` below. What stays, all of it run on this repository's own
    # patterns at lint or build time, none of it shipped:
    # - 3.1.5 and 5.1.9, under electron-builder (@electron/asar, glob 7,
    #   jake's filelist): older than optimizationLevel, which came in 7.1, so
    #   without the step, and unable to call 11's API.
    # - 10.x under app-builder-lib 26.15.3, which reads the compiled `set`
    #   of the packaging config's file patterns, which 11 changed. Waits on
    #   a release of it that accepts 11.
    - GHSA-g3hv-75wg-m249
    # picomatch <=4.0.7, with no fixed version: a glob someone else supplies,
    # such as +(*), can make its regular expression backtrack without end.
    # It reaches us only through knip, tinyglobby, Vite and Vitest, which
    # match this repository's own patterns at lint, build and test time.
    # Nothing of it ships.
    - GHSA-fc5q-39xc-vjpf

# Kept only where a parent's range excludes the fix.
overrides:
  # KaTeX <0.18.2, GHSA-238p-pmpm-9mq7: an existing prototype pollution can
  # bypass KaTeX's trust restrictions. It ships with mermaid, which renders
  # diagrams the model writes; mermaid 11.17.2 and 12.1.0 both ask for katex
  # ^0.16.47, and no 0.16 release has the fix.
  katex: ^0.18.2
  # undici <6.29.1 (GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685), undici 8
  # <8.12.2 (GHSA-4w7w-5xrc-9h26 and seven more) and fast-uri <3.1.9
  # (GHSA-w74x-v6f9-j3xg and three more). Their parents (node-gyp, jsdom,
  # ajv) ask for ranges that hold the fix, but pnpm 11.25.0's update left
  # the locked versions where they were, so each vulnerable range is moved
  # to its fix here.
  "undici@>=6.5.0 <6.29.1": ^6.29.1
  "undici@>=8.0.0 <8.12.2": ^8.12.2
  "fast-uri@>=3.0.0 <3.1.9": ^3.1.9
  # minimatch <11.0.1, GHSA-g3hv-75wg-m249: a glob pattern can make the
  # preprocessing at optimizationLevel 2 grow, then compare its parts
  # pairwise. ESLint 10 asks for ^10.2.6, @eslint/config-array for ^10.2.4,
  # typescript-estree for ^10.2.2 and electron-builder's @electron/universal
  # for ^9. ESLint calls only `new Minimatch()` and `match()`, and the other
  # two only `minimatch()`, all of which 11 keeps. app-builder-lib is not
  # moved (see `auditConfig`).
  "eslint>minimatch": ^11.0.3
  "@eslint/config-array>minimatch": ^11.0.3
  "@typescript-eslint/typescript-estree>minimatch": ^11.0.3
  "@electron/universal>minimatch": ^11.0.3

minimumReleaseAgeExclude:
  - "@types/node@26.4.1"
  - electron@44.9.3
  - globals@17.12.0
