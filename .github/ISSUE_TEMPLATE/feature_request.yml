name: Feature request
description: An idea that would make Zhiyin more useful.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The task or situation, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How Zhiyin could make it easier.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Optional. What you use or do instead at the moment.
