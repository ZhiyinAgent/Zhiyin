name: Bug report
description: Something in Zhiyin does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For a security problem,
        use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps that lead to it, as far as you know them.
      placeholder: |
        1. Open a new conversation
        2. Ask for ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zhiyin version
      description: The version you installed, such as 0.1.0-alpha.1, or the commit you built.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: The model chosen on the Model page, if the problem involves the agent's answers.
  - type: textarea
    id: log
    attributes:
      label: Diagnostic log
      description: |
        Optional. Zhiyin writes one file per day in %APPDATA%\Zhiyin\logs.
        Paste the lines around the problem, after checking they hold nothing
        private.
      render: text
