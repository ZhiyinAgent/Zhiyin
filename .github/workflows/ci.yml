name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # Weekly, so an advisory published while nobody commits still fails the
  # gate's audit step and is reported.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Repository gate
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Enable the pinned pnpm version
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Install the Electron runtime after the clean install
        shell: powershell
        run: pnpm --filter desktop install:electron

      - name: Run the repository gate
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/gate.ps1
